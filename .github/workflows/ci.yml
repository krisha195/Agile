name: GearGuard Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Automated Security Vulnerability Audit
  # ─────────────────────────────────────────────────────────────
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backend Security Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Run Frontend Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ─────────────────────────────────────────────────────────────
  # Job 2: Backend Unit & Integration Tests
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: ./backend
        env:
          JWT_SECRET: ci-test-secret-key-12345
          NODE_ENV: test
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # Job 3: Frontend Unit & Component Tests
  # ─────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

  # ─────────────────────────────────────────────────────────────
  # Job 4: Frontend Production Build & Artifact Storage
  # ─────────────────────────────────────────────────────────────
  frontend-build:
    name: Production Build & Package
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build production bundle
        working-directory: ./frontend
        env:
          CI: false
          REACT_APP_API_URL: /api
        run: npm run build

      - name: Validate build artifacts
        working-directory: ./frontend
        run: |
          test -d build || exit 1
          test -f build/index.html || exit 1

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/build/
          retention-days: 7
