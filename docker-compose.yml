version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gearguard-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gearguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gearguard-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/gearguard
      - JWT_SECRET=gearguard_super_secret_jwt_key_2026
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - gearguard-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gearguard-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gearguard-network

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  gearguard-network:
    driver: bridge
